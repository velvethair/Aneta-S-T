<!DOCTYPE html>
<html lang="mk">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Aneta S-T | Admin</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;

      background: #edf2e7;

      color: #354238;

      padding: 30px;
    }

    .container {
      max-width: 1200px;

      margin: auto;
    }

    .header {
      background: #fffef8;

      border: 1px solid #d7e0d0;

      border-radius: 20px;

      padding: 25px 30px;

      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 20px;

      margin-bottom: 25px;
    }

    .logo {
      font-family: Georgia, serif;

      font-size: 28px;

      font-weight: bold;

      color: #536b58;
    }

    .logo span {
      color: #b5a34f;
    }

    .subtitle {
      color: #7a877d;

      font-size: 14px;

      margin-top: 4px;
    }

    .logout {
      border: none;

      background: #536b58;

      color: white;

      padding: 12px 20px;

      border-radius: 25px;

      cursor: pointer;

      font-weight: bold;
    }

    .logout:hover {
      background: #405544;
    }

    .card {
      background: #fffef8;

      border: 1px solid #d7e0d0;

      border-radius: 20px;

      padding: 25px;
    }

    .card h2 {
      font-family: Georgia, serif;

      margin-bottom: 15px;

      color: #536b58;
    }

    .status {
      margin-bottom: 15px;

      color: #708075;
    }

    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;

      border-collapse: collapse;

      min-width: 760px;
    }

    th {
      background: #dfe8d9;

      color: #536b58;

      padding: 14px;

      text-align: left;

      font-size: 13px;
    }

    td {
      padding: 14px;

      border-bottom: 1px solid #e4e9df;

      font-size: 14px;
    }

    tr:hover {
      background: #faf9f1;
    }

    .delete-button {
      border: none;

      background: #d9a6a0;

      color: white;

      padding: 8px 13px;

      border-radius: 18px;

      cursor: pointer;

      font-size: 12px;

      font-weight: bold;
    }

    .delete-button:hover {
      background: #bd7770;
    }

    .empty {
      text-align: center;

      color: #7a877d;

      padding: 35px;
    }

    @media (max-width: 700px) {

      body {
        padding: 15px;
      }

      .header {
        flex-direction: column;

        align-items: flex-start;
      }

    }

  </style>

</head>


<body>

  <div class="container">

    <div class="header">

      <div>

        <div class="logo">
          ANETA <span>S-T</span>
        </div>

        <div class="subtitle">
          Admin панел • Резервации
        </div>

      </div>


      <button
        class="logout"
        id="logoutButton"
      >
        Одјави се
      </button>

    </div>


    <div class="card">

      <h2>
        Закажани термини
      </h2>

      <div
        class="status"
        id="status"
      >
        Се вчитуваат резервациите...
      </div>


      <div class="table-wrapper">

        <table>

          <thead>

            <tr>

              <th>
                Датум
              </th>

              <th>
                Време
              </th>

              <th>
                Клиент
              </th>

              <th>
                Телефон
              </th>

              <th>
                Услуга
              </th>

              <th>
                Акција
              </th>

            </tr>

          </thead>


          <tbody id="bookingsBody"></tbody>

        </table>

      </div>

    </div>

  </div>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL =
      "https://rrzhahtngfyibmluywnx.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_5h-dxVdOY5NoXcy0EgWjuA_aX2j4jpt";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    const bookingsBody =
      document.getElementById(
        "bookingsBody"
      );

    const statusElement =
      document.getElementById(
        "status"
      );

    const logoutButton =
      document.getElementById(
        "logoutButton"
      );


    async function checkUser() {

      const {
        data,
        error
      } =
        await supabaseClient.auth
          .getUser();


      if (
        error ||
        !data.user
      ) {

        window.location.href =
          "login.html";

        return null;
      }


      return data.user;
    }


    async function loadBookings() {

      const user =
        await checkUser();

      if (!user) {
        return;
      }


      const {
        data,
        error
      } =
        await supabaseClient
          .from("bookings")
          .select(
            "id, name, phone, service, booking_date, booking_time"
          )
          .order(
            "booking_date",
            {
              ascending: true
            }
          )
          .order(
            "booking_time",
            {
              ascending: true
            }
          );


      if (error) {

        console.error(
          error
        );

        statusElement.textContent =
          "Грешка при вчитување на резервациите.";

        return;
      }


      bookingsBody.innerHTML =
        "";


      if (
        !data ||
        data.length === 0
      ) {

        statusElement.textContent =
          "Нема закажани термини.";

        bookingsBody.innerHTML = `
          <tr>
            <td
              colspan="6"
              class="empty"
            >
              Моментално нема резервации.
            </td>
          </tr>
        `;

        return;
      }


      statusElement.textContent =
        `Вкупно резервации: ${data.length}`;


      data.forEach(
        booking => {

          const row =
            document.createElement(
              "tr"
            );


          const date =
            String(
              booking.booking_date
            );


          const time =
            String(
              booking.booking_time
            ).slice(0, 5);


          row.innerHTML = `

            <td>
              ${escapeHtml(date)}
            </td>

            <td>
              ${escapeHtml(time)}
            </td>

            <td>
              ${escapeHtml(
                booking.name
              )}
            </td>

            <td>
              ${escapeHtml(
                booking.phone
              )}
            </td>

            <td>
              ${escapeHtml(
                booking.service
              )}
            </td>

            <td>

              <button
                class="delete-button"
                data-id="${booking.id}"
              >
                Откажи
              </button>

            </td>

          `;


          bookingsBody.appendChild(
            row
          );

        }
      );


      document
        .querySelectorAll(
          ".delete-button"
        )
        .forEach(
          button => {

            button.addEventListener(
              "click",
              async function() {

                const id =
                  this.dataset.id;


                const confirmed =
                  confirm(
                    "Дали сигурно сакаш да ја откажеш оваа резервација?"
                  );


                if (!confirmed) {
                  return;
                }


                const {
                  error
                } =
                  await supabaseClient
                    .from("bookings")
                    .delete()
                    .eq(
                      "id",
                      id
                    );


                if (error) {

                  alert(
                    "Неуспешно бришење: " +
                    error.message
                  );

                  return;
                }


                await loadBookings();

              }
            );

          }
        );

    }


    function escapeHtml(value) {

      return String(value ?? "")
        .replaceAll(
          "&",
          "&amp;"
        )
        .replaceAll(
          "<",
          "&lt;"
        )
        .replaceAll(
          ">",
          "&gt;"
        )
        .replaceAll(
          '"',
          "&quot;"
        )
        .replaceAll(
          "'",
          "&#039;"
        );

    }


    logoutButton.addEventListener(
      "click",
      async function() {

        await supabaseClient
          .auth
          .signOut();

        window.location.href =
          "login.html";

      }
    );


    loadBookings();

  </script>

</body>
</html>
