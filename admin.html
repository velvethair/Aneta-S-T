<!DOCTYPE html>
<html lang="mk">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Aneta S-T | Admin</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #edf2e7;
      color: #354238;
      padding: 30px;
    }

    .container {
      max-width: 1200px;
      margin: auto;
    }

    .header {
      background: #fffef8;
      border: 1px solid #d7e0d0;
      border-radius: 20px;
      padding: 25px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 25px;
    }

    .logo {
      font-family: Georgia, serif;
      font-size: 28px;
      font-weight: bold;
      color: #536b58;
    }

    .logo span {
      color: #b5a34f;
    }

    .subtitle {
      color: #7a877d;
      font-size: 14px;
      margin-top: 4px;
    }

    button {
      font-family: inherit;
    }

    .logout {
      border: none;
      background: #536b58;
      color: white;
      padding: 12px 20px;
      border-radius: 25px;
      cursor: pointer;
      font-weight: bold;
    }

    .logout:hover {
      background: #405544;
    }

    .card {
      background: #fffef8;
      border: 1px solid #d7e0d0;
      border-radius: 20px;
      padding: 25px;
      margin-bottom: 25px;
    }

    .card h2 {
      font-family: Georgia, serif;
      margin-bottom: 20px;
      color: #536b58;
    }

    /* BLOCK DATE */

    .block-form {
      display: flex;
      gap: 12px;
      align-items: end;
      flex-wrap: wrap;
    }

    .field {
      flex: 1;
      min-width: 230px;
    }

    .field label {
      display: block;
      margin-bottom: 8px;
      color: #536b58;
      font-size: 13px;
      font-weight: bold;
    }

    .field input {
      width: 100%;
      min-height: 48px;
      padding: 12px 14px;
      border: 1px solid #d6e0d0;
      border-radius: 10px;
      background: #fbfcf6;
      color: #354238;
      outline: none;
    }

    .field input:focus {
      border-color: #b5a446;
      box-shadow: 0 0 0 3px rgba(181, 164, 70, 0.11);
    }

    .primary {
      min-height: 48px;
      padding: 0 22px;
      border: none;
      border-radius: 25px;
      background: #536b58;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    .primary:hover {
      background: #405544;
    }

    .primary:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    .message {
      min-height: 24px;
      margin-top: 15px;
      font-size: 14px;
      font-weight: bold;
    }

    /* BLOCKED DATES */

    .status {
      margin-bottom: 15px;
      color: #708075;
    }

    .blocked-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .blocked-item {
      background: #f8f1c9;
      border: 1px solid #d5c76d;
      border-radius: 20px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
    }

    .unblock {
      border: none;
      background: #d9a6a0;
      color: white;
      padding: 5px 10px;
      border-radius: 15px;
      cursor: pointer;
      font-size: 12px;
    }

    .unblock:hover {
      background: #bd7770;
    }

    /* BOOKINGS */

    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 760px;
    }

    th {
      background: #dfe8d9;
      color: #536b58;
      padding: 14px;
      text-align: left;
      font-size: 13px;
    }

    td {
      padding: 14px;
      border-bottom: 1px solid #e4e9df;
      font-size: 14px;
    }

    tr:hover {
      background: #faf9f1;
    }

    .delete-button {
      border: none;
      background: #d9a6a0;
      color: white;
      padding: 8px 13px;
      border-radius: 18px;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
    }

    .delete-button:hover {
      background: #bd7770;
    }

    .empty {
      text-align: center;
      color: #7a877d;
      padding: 35px;
    }

    /* LOADING */

    .loading {
      color: #708075;
    }

    @media (max-width: 700px) {

      body {
        padding: 15px;
      }

      .header {
        flex-direction: column;
        align-items: flex-start;
      }

      .block-form {
        flex-direction: column;
        align-items: stretch;
      }

      .primary {
        width: 100%;
      }

    }

  </style>

</head>

<body>

  <div class="container">

    <!-- HEADER -->

    <div class="header">

      <div>

        <div class="logo">
          ANETA <span>S-T</span>
        </div>

        <div class="subtitle">
          Admin панел • Резервации
        </div>

      </div>

      <button
        class="logout"
        id="logoutButton"
      >
        Одјави се
      </button>

    </div>


    <!-- BLOCK DATE -->

    <div class="card">

      <h2>
        Блокирај датум
      </h2>

      <form
        id="blockDateForm"
        class="block-form"
      >

        <div class="field">

          <label for="blockedDate">
            Датум на кој не се работи
          </label>

          <input
            type="date"
            id="blockedDate"
            required
          >

        </div>

        <button
          type="submit"
          class="primary"
          id="blockButton"
        >
          Блокирај датум
        </button>

      </form>

      <div
        id="blockMessage"
        class="message"
      ></div>

    </div>


    <!-- BLOCKED DATES -->

    <div class="card">

      <h2>
        Блокирани датуми
      </h2>

      <div
        id="blockedStatus"
        class="status"
      >
        Се вчитува...
      </div>

      <div
        id="blockedList"
        class="blocked-list"
      ></div>

    </div>


    <!-- BOOKINGS -->

    <div class="card">

      <h2>
        Закажани термини
      </h2>

      <div
        id="status"
        class="status"
      >
        Се вчитуваат резервациите...
      </div>

      <div class="table-wrapper">

        <table>

          <thead>

            <tr>

              <th>
                Датум
              </th>

              <th>
                Време
              </th>

              <th>
                Клиент
              </th>

              <th>
                Телефон
              </th>

              <th>
                Услуга
              </th>

              <th>
                Акција
              </th>

            </tr>

          </thead>

          <tbody id="bookingsBody"></tbody>

        </table>

      </div>

    </div>

  </div>


  <!-- SUPABASE -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL =
      "https://rrzhahtngfyibmluywnx.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_5h-dxVdOY5NoXcy0EgWjuA_aX2j4jpt";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    /* ELEMENTS */

    const bookingsBody =
      document.getElementById(
        "bookingsBody"
      );

    const statusElement =
      document.getElementById(
        "status"
      );

    const blockedStatus =
      document.getElementById(
        "blockedStatus"
      );

    const blockedList =
      document.getElementById(
        "blockedList"
      );

    const blockDateForm =
      document.getElementById(
        "blockDateForm"
      );

    const blockedDateInput =
      document.getElementById(
        "blockedDate"
      );

    const blockButton =
      document.getElementById(
        "blockButton"
      );

    const blockMessage =
      document.getElementById(
        "blockMessage"
      );

    const logoutButton =
      document.getElementById(
        "logoutButton"
      );


    /* ==========================
       CHECK LOGIN
    ========================== */

    async function checkUser() {

      const {
        data,
        error
      } =
        await supabaseClient.auth
          .getUser();


      if (
        error ||
        !data.user
      ) {

        window.location.href =
          "login.html";

        return null;
      }


      return data.user;
    }


    /* ==========================
       HTML SAFETY
    ========================== */

    function escapeHtml(value) {

      return String(
        value ?? ""
      )
        .replaceAll(
          "&",
          "&amp;"
        )
        .replaceAll(
          "<",
          "&lt;"
        )
        .replaceAll(
          ">",
          "&gt;"
        )
        .replaceAll(
          '"',
          "&quot;"
        )
        .replaceAll(
          "'",
          "&#039;"
        );

    }


    /* ==========================
       MESSAGE
    ========================== */

    function showBlockMessage(
      message,
      success = false
    ) {

      blockMessage.textContent =
        message;

      blockMessage.style.color =
        success
          ? "#536b58"
          : "#bd7770";

    }


    /* ==========================
       LOAD BLOCKED DATES
    ========================== */

    async function loadBlockedDates() {

      blockedStatus.textContent =
        "Се вчитуваат...";

      blockedList.innerHTML =
        "";


      const {
        data,
        error
      } =
        await supabaseClient
          .from("blocked_dates")
          .select(
            "blocked_date"
          )
          .order(
            "blocked_date",
            {
              ascending: true
            }
          );


      if (error) {

        console.error(
          "BLOCKED DATES ERROR:",
          error
        );

        blockedStatus.textContent =
          "Грешка при вчитување.";

        return;
      }


      if (
        !data ||
        data.length === 0
      ) {

        blockedStatus.textContent =
          "Нема блокирани датуми.";

        return;
      }


      blockedStatus.textContent =
        `Вкупно блокирани датуми: ${data.length}`;


      data.forEach(
        item => {

          const wrapper =
            document.createElement(
              "div"
            );

          wrapper.className =
            "blocked-item";


          const dateText =
            document.createElement(
              "span"
            );

          dateText.textContent =
            item.blocked_date;


          const unblockButton =
            document.createElement(
              "button"
            );

          unblockButton.className =
            "unblock";

          unblockButton.textContent =
            "Одблокирај";

          unblockButton.dataset.date =
            item.blocked_date;


          unblockButton.addEventListener(
            "click",
            async function() {

              const date =
                this.dataset.date;


              const confirmed =
                confirm(
                  `Дали сакаш да го одблокираш ${date}?`
                );


              if (!confirmed) {
                return;
              }


              const {
                error
              } =
                await supabaseClient
                  .from(
                    "blocked_dates"
                  )
                  .delete()
                  .eq(
                    "blocked_date",
                    date
                  );


              if (error) {

                alert(
                  "Грешка: " +
                  error.message
                );

                return;
              }


              showBlockMessage(
                "Датумот е одблокиран.",
                true
              );


              await loadBlockedDates();

            }
          );


          wrapper.appendChild(
            dateText
          );

          wrapper.appendChild(
            unblockButton
          );

          blockedList.appendChild(
            wrapper
          );

        }
      );

    }


    /* ==========================
       BLOCK DATE
    ========================== */

    blockDateForm.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        const date =
          blockedDateInput.value;


        if (!date) {

          showBlockMessage(
            "Избери датум."
          );

          return;
        }


        blockButton.disabled =
          true;

        blockButton.textContent =
          "Се зачувува...";


        try {

          const {
            error
          } =
            await supabaseClient
              .from(
                "blocked_dates"
              )
              .insert({
                blocked_date: date
              });


          if (error) {

            if (
              error.code ===
              "23505"
            ) {

              showBlockMessage(
                "Овој датум веќе е блокиран."
              );

            } else {

              showBlockMessage(
                "Грешка: " +
                error.message
              );

            }

            return;
          }


          blockedDateInput.value =
            "";


          showBlockMessage(
            "✅ Датумот е успешно блокиран.",
            true
          );


          await loadBlockedDates();


        } catch (error) {

          console.error(
            error
          );

          showBlockMessage(
            "Се појави грешка."
          );

        } finally {

          blockButton.disabled =
            false;

          blockButton.textContent =
            "Блокирај датум";

        }

      }
    );


    /* ==========================
       LOAD BOOKINGS
    ========================== */

    async function loadBookings() {

      const user =
        await checkUser();


      if (!user) {
        return;
      }


      const {
        data,
        error
      } =
        await supabaseClient
          .from("bookings")
          .select(
            "id, name, phone, service, booking_date, booking_time"
          )
          .order(
            "booking_date",
            {
              ascending: true
            }
          )
          .order(
            "booking_time",
            {
              ascending: true
            }
          );


      if (error) {

        console.error(
          "BOOKINGS ERROR:",
          error
        );

        statusElement.textContent =
          "Грешка при вчитување на резервациите.";

        return;
      }


      bookingsBody.innerHTML =
        "";


      if (
        !data ||
        data.length === 0
      ) {

        statusElement.textContent =
          "Нема закажани термини.";

        bookingsBody.innerHTML = `
          <tr>
            <td
              colspan="6"
              class="empty"
            >
              Моментално нема резервации.
            </td>
          </tr>
        `;

        return;
      }


      statusElement.textContent =
        `Вкупно резервации: ${data.length}`;


      data.forEach(
        booking => {

          const row =
            document.createElement(
              "tr"
            );


          const date =
            String(
              booking.booking_date
            );


          const time =
            String(
              booking.booking_time
            ).slice(0, 5);


          row.innerHTML = `

            <td>
              ${escapeHtml(date)}
            </td>

            <td>
              ${escapeHtml(time)}
            </td>

            <td>
              ${escapeHtml(
                booking.name
              )}
            </td>

            <td>
              ${escapeHtml(
                booking.phone
              )}
            </td>

            <td>
              ${escapeHtml(
                booking.service
              )}
            </td>

            <td>

              <button
                class="delete-button"
                data-id="${booking.id}"
              >
                Откажи
              </button>

            </td>

          `;


          bookingsBody.appendChild(
            row
          );

        }
      );


      document
        .querySelectorAll(
          ".delete-button"
        )
        .forEach(
          button => {

            button.addEventListener(
              "click",
              async function() {

                const id =
                  this.dataset.id;


                const confirmed =
                  confirm(
                    "Дали сигурно сакаш да ја откажеш оваа резервација?"
                  );


                if (!confirmed) {
                  return;
                }


                const {
                  error
                } =
                  await supabaseClient
                    .from(
                      "bookings"
                    )
                    .delete()
                    .eq(
                      "id",
                      id
                    );


                if (error) {

                  alert(
                    "Грешка: " +
                    error.message
                  );

                  return;
                }


                await loadBookings();

              }
            );

          }
        );

    }


    /* ==========================
       LOGOUT
    ========================== */

    logoutButton.addEventListener(
      "click",
      async function() {

        await supabaseClient.auth
          .signOut();

        window.location.href =
          "login.html";

      }
    );


    /* ==========================
       START
    ========================== */

    loadBlockedDates();
    loadBookings();

  </script>

</body>
</html>
