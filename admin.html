<!DOCTYPE html>
<html lang="mk">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Aneta S-T | Admin</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #edf2e7;
      color: #354238;
      padding: 30px;
    }

    .container {
      max-width: 1200px;
      margin: auto;
    }

    .header {
      background: #fffef8;
      border: 1px solid #d7e0d0;
      border-radius: 20px;
      padding: 25px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 25px;
    }

    .logo {
      font-family: Georgia, serif;
      font-size: 28px;
      font-weight: bold;
      color: #536b58;
    }

    .logo span {
      color: #b5a34f;
    }

    .subtitle {
      color: #7a877d;
      font-size: 14px;
      margin-top: 4px;
    }

    button {
      font-family: inherit;
    }

    .logout {
      border: none;
      background: #536b58;
      color: white;
      padding: 12px 20px;
      border-radius: 25px;
      cursor: pointer;
      font-weight: bold;
    }

    .logout:hover {
      background: #405544;
    }

    .card {
      background: #fffef8;
      border: 1px solid #d7e0d0;
      border-radius: 20px;
      padding: 25px;
      margin-bottom: 25px;
    }

    .card h2 {
      font-family: Georgia, serif;
      color: #536b58;
      margin-bottom: 20px;
    }

    /* BLOCK OPTIONS */

    .block-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 25px;
    }

    .block-box {
      background: #faf9f1;
      border: 1px solid #dce4d7;
      border-radius: 18px;
      padding: 22px;
    }

    .block-box h3 {
      color: #536b58;
      margin-bottom: 15px;
      font-family: Georgia, serif;
    }

    .field {
      margin-bottom: 14px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: bold;
      color: #536b58;
    }

    input,
    select {
      width: 100%;
      min-height: 48px;
      padding: 11px 13px;
      border: 1px solid #d6e0d0;
      border-radius: 10px;
      background: #fbfcf6;
      color: #354238;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #b5a446;
      box-shadow: 0 0 0 3px rgba(181, 164, 70, 0.11);
    }

    .primary {
      min-height: 46px;
      padding: 0 20px;
      border: none;
      border-radius: 25px;
      background: #536b58;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    .primary:hover {
      background: #405544;
    }

    .primary:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    .message {
      min-height: 24px;
      margin-top: 15px;
      font-size: 14px;
      font-weight: bold;
    }

    /* BLOCKED LISTS */

    .status {
      margin-bottom: 15px;
      color: #708075;
    }

    .blocked-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .blocked-item {
      background: #f8f1c9;
      border: 1px solid #d5c76d;
      border-radius: 20px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
    }

    .unblock {
      border: none;
      background: #d9a6a0;
      color: white;
      padding: 5px 10px;
      border-radius: 15px;
      cursor: pointer;
      font-size: 12px;
    }

    /* BOOKINGS */

    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 760px;
    }

    th {
      background: #dfe8d9;
      color: #536b58;
      padding: 14px;
      text-align: left;
      font-size: 13px;
    }

    td {
      padding: 14px;
      border-bottom: 1px solid #e4e9df;
      font-size: 14px;
    }

    tr:hover {
      background: #faf9f1;
    }

    .delete-button {
      border: none;
      background: #d9a6a0;
      color: white;
      padding: 8px 13px;
      border-radius: 18px;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
    }

    .empty {
      text-align: center;
      color: #7a877d;
      padding: 35px;
    }

    @media (max-width: 800px) {

      body {
        padding: 15px;
      }

      .header {
        flex-direction: column;
        align-items: flex-start;
      }

      .block-grid {
        grid-template-columns: 1fr;
      }

    }

  </style>

</head>

<body>

<div class="container">

  <!-- HEADER -->

  <div class="header">

    <div>

      <div class="logo">
        ANETA <span>S-T</span>
      </div>

      <div class="subtitle">
        Admin панел • Резервации
      </div>

    </div>

    <button
      class="logout"
      id="logoutButton"
    >
      Одјави се
    </button>

  </div>


  <!-- BLOCKING -->

  <div class="card">

    <h2>
      Блокирање
    </h2>

    <div class="block-grid">

      <!-- FULL DAY -->

      <div class="block-box">

        <h3>
          Блокирај цел ден
        </h3>

        <form id="blockDateForm">

          <div class="field">

            <label for="blockedDate">
              Датум
            </label>

            <input
              type="date"
              id="blockedDate"
              required
            >

          </div>

          <button
            type="submit"
            class="primary"
            id="blockDateButton"
          >
            Блокирај ден
          </button>

        </form>

      </div>


      <!-- SINGLE TIME -->

      <div class="block-box">

        <h3>
          Блокирај само термин
        </h3>

        <form id="blockTimeForm">

          <div class="field">

            <label for="blockedTimeDate">
              Датум
            </label>

            <input
              type="date"
              id="blockedTimeDate"
              required
            >

          </div>


          <div class="field">

            <label for="blockedTime">
              Време
            </label>

            <select
              id="blockedTime"
              required
            >

              <option value="">
                Избери време
              </option>

              <option value="09:00">
                09:00
              </option>

              <option value="10:00">
                10:00
              </option>

              <option value="11:00">
                11:00
              </option>

              <option value="12:00">
                12:00
              </option>

              <option value="13:00">
                13:00
              </option>

              <option value="14:00">
                14:00
              </option>

              <option value="15:00">
                15:00
              </option>

              <option value="16:00">
                16:00
              </option>

              <option value="17:00">
                17:00
              </option>

              <option value="18:00">
                18:00
              </option>

            </select>

          </div>


          <button
            type="submit"
            class="primary"
            id="blockTimeButton"
          >
            Блокирај термин
          </button>

        </form>

      </div>

    </div>


    <div
      id="blockMessage"
      class="message"
    ></div>

  </div>


  <!-- BLOCKED DAYS -->

  <div class="card">

    <h2>
      Блокирани денови
    </h2>

    <div
      id="blockedDatesStatus"
      class="status"
    >
      Се вчитува...
    </div>

    <div
      id="blockedDatesList"
      class="blocked-list"
    ></div>

  </div>


  <!-- BLOCKED TIMES -->

  <div class="card">

    <h2>
      Блокирани термини
    </h2>

    <div
      id="blockedTimesStatus"
      class="status"
    >
      Се вчитува...
    </div>

    <div
      id="blockedTimesList"
      class="blocked-list"
    ></div>

  </div>


  <!-- BOOKINGS -->

  <div class="card">

    <h2>
      Закажани термини
    </h2>

    <div
      id="status"
      class="status"
    >
      Се вчитуваат резервациите...
    </div>

    <div class="table-wrapper">

      <table>

        <thead>

          <tr>
            <th>Датум</th>
            <th>Време</th>
            <th>Клиент</th>
            <th>Телефон</th>
            <th>Услуга</th>
            <th>Акција</th>
          </tr>

        </thead>

        <tbody
          id="bookingsBody"
        ></tbody>

      </table>

    </div>

  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://rrzhahtngfyibmluywnx.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_5h-dxVdOY5NoXcy0EgWjuA_aX2j4jpt";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


/* ELEMENTS */

const blockedDateForm =
  document.getElementById(
    "blockDateForm"
  );

const blockedDateInput =
  document.getElementById(
    "blockedDate"
  );

const blockedTimeForm =
  document.getElementById(
    "blockTimeForm"
  );

const blockedTimeDateInput =
  document.getElementById(
    "blockedTimeDate"
  );

const blockedTimeInput =
  document.getElementById(
    "blockedTime"
  );

const blockMessage =
  document.getElementById(
    "blockMessage"
  );

const blockDateButton =
  document.getElementById(
    "blockDateButton"
  );

const blockTimeButton =
  document.getElementById(
    "blockTimeButton"
  );

const blockedDatesStatus =
  document.getElementById(
    "blockedDatesStatus"
  );

const blockedDatesList =
  document.getElementById(
    "blockedDatesList"
  );

const blockedTimesStatus =
  document.getElementById(
    "blockedTimesStatus"
  );

const blockedTimesList =
  document.getElementById(
    "blockedTimesList"
  );

const bookingsBody =
  document.getElementById(
    "bookingsBody"
  );

const statusElement =
  document.getElementById(
    "status"
  );

const logoutButton =
  document.getElementById(
    "logoutButton"
  );


/* ==========================
   LOGIN CHECK
========================== */

async function checkUser() {

  const {
    data,
    error
  } =
    await supabaseClient.auth
      .getUser();

  if (
    error ||
    !data.user
  ) {

    window.location.href =
      "login.html";

    return null;
  }

  return data.user;
}


/* ==========================
   MESSAGE
========================== */

function showBlockMessage(
  message,
  success = false
) {

  blockMessage.textContent =
    message;

  blockMessage.style.color =
    success
      ? "#536b58"
      : "#bd7770";
}


/* ==========================
   LOAD BLOCKED DATES
========================== */

async function loadBlockedDates() {

  const {
    data,
    error
  } =
    await supabaseClient
      .from("blocked_dates")
      .select("blocked_date")
      .order(
        "blocked_date",
        {
          ascending: true
        }
      );

  if (error) {

    console.error(
      error
    );

    blockedDatesStatus.textContent =
      "Грешка при вчитување.";

    return;
  }

  blockedDatesList.innerHTML =
    "";

  if (
    !data ||
    data.length === 0
  ) {

    blockedDatesStatus.textContent =
      "Нема блокирани денови.";

    return;
  }

  blockedDatesStatus.textContent =
    `Вкупно: ${data.length}`;


  data.forEach(
    item => {

      const wrapper =
        document.createElement(
          "div"
        );

      wrapper.className =
        "blocked-item";


      const text =
        document.createElement(
          "span"
        );

      text.textContent =
        item.blocked_date;


      const button =
        document.createElement(
          "button"
        );

      button.className =
        "unblock";

      button.textContent =
        "Одблокирај";


      button.addEventListener(
        "click",
        async function() {

          const confirmed =
            confirm(
              `Да се одблокира ${item.blocked_date}?`
            );

          if (!confirmed) {
            return;
          }

          const {
            error
          } =
            await supabaseClient
              .from("blocked_dates")
              .delete()
              .eq(
                "blocked_date",
                item.blocked_date
              );


          if (error) {

            alert(
              error.message
            );

            return;
          }


          await loadBlockedDates();

        }
      );


      wrapper.appendChild(text);
      wrapper.appendChild(button);

      blockedDatesList.appendChild(
        wrapper
      );

    }
  );
}


/* ==========================
   BLOCK FULL DAY
========================== */

blockedDateForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();

    const date =
      blockedDateInput.value;


    if (!date) {
      return;
    }


    blockDateButton.disabled =
      true;

    blockDateButton.textContent =
      "Се зачувува...";


    try {

      const {
        error
      } =
        await supabaseClient
          .from("blocked_dates")
          .insert({
            blocked_date:
              date
          });


      if (error) {

        if (
          error.code ===
          "23505"
        ) {

          showBlockMessage(
            "Овој ден веќе е блокиран."
          );

        } else {

          showBlockMessage(
            "Грешка: " +
            error.message
          );

        }

        return;
      }


      blockedDateInput.value =
        "";

      showBlockMessage(
        "✅ Целиот ден е блокиран.",
        true
      );


      await loadBlockedDates();

    } finally {

      blockDateButton.disabled =
        false;

      blockDateButton.textContent =
        "Блокирај ден";

    }

  }
);


/* ==========================
   LOAD BLOCKED TIMES
========================== */

async function loadBlockedTimes() {

  const {
    data,
    error
  } =
    await supabaseClient
      .from("blocked_times")
      .select(
        "blocked_date, blocked_time"
      )
      .order(
        "blocked_date",
        {
          ascending: true
        }
      )
      .order(
        "blocked_time",
        {
          ascending: true
        }
      );


  if (error) {

    console.error(
      error
    );

    blockedTimesStatus.textContent =
      "Грешка при вчитување.";

    return;
  }


  blockedTimesList.innerHTML =
    "";


  if (
    !data ||
    data.length === 0
  ) {

    blockedTimesStatus.textContent =
      "Нема блокирани термини.";

    return;
  }


  blockedTimesStatus.textContent =
    `Вкупно: ${data.length}`;


  data.forEach(
    item => {

      const wrapper =
        document.createElement(
          "div"
        );

      wrapper.className =
        "blocked-item";


      const time =
        String(
          item.blocked_time
        ).slice(0, 5);


      const text =
        document.createElement(
          "span"
        );

      text.textContent =
        `${item.blocked_date} • ${time}`;


      const button =
        document.createElement(
          "button"
        );

      button.className =
        "unblock";

      button.textContent =
        "Одблокирај";


      button.addEventListener(
        "click",
        async function() {

          const confirmed =
            confirm(
              `Да се одблокира ${item.blocked_date} во ${time}?`
            );


          if (!confirmed) {
            return;
          }


          const {
            error
          } =
            await supabaseClient
              .from("blocked_times")
              .delete()
              .eq(
                "blocked_date",
                item.blocked_date
              )
              .eq(
                "blocked_time",
                item.blocked_time
              );


          if (error) {

            alert(
              error.message
            );

            return;
          }


          await loadBlockedTimes();

        }
      );


      wrapper.appendChild(text);
      wrapper.appendChild(button);

      blockedTimesList.appendChild(
        wrapper
      );

    }
  );
}


/* ==========================
   BLOCK SINGLE TIME
========================== */

blockedTimeForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();


    const date =
      blockedTimeDateInput.value;

    const time =
      blockedTimeInput.value;


    if (
      !date ||
      !time
    ) {
      return;
    }


    blockTimeButton.disabled =
      true;

    blockTimeButton.textContent =
      "Се зачувува...";


    try {

      const {
        error
      } =
        await supabaseClient
          .from("blocked_times")
          .insert({
            blocked_date:
              date,

            blocked_time:
              time
          });


      if (error) {

        if (
          error.code ===
          "23505"
        ) {

          showBlockMessage(
            "Овој термин веќе е блокиран."
          );

        } else {

          showBlockMessage(
            "Грешка: " +
            error.message
          );

        }

        return;
      }


      blockedTimeDateInput.value =
        "";

      blockedTimeInput.value =
        "";


      showBlockMessage(
        "✅ Терминот е блокиран.",
        true
      );


      await loadBlockedTimes();

    } finally {

      blockTimeButton.disabled =
        false;

      blockTimeButton.textContent =
        "Блокирај термин";

    }

  }
);


/* ==========================
   LOAD BOOKINGS
========================== */

async function loadBookings() {

  const user =
    await checkUser();

  if (!user) {
    return;
  }


  const {
    data,
    error
  } =
    await supabaseClient
      .from("bookings")
      .select(
        "id, name, phone, service, booking_date, booking_time"
      )
      .order(
        "booking_date",
        {
          ascending: true
        }
      )
      .order(
        "booking_time",
        {
          ascending: true
        }
      );


  if (error) {

    console.error(
      error
    );

    statusElement.textContent =
      "Грешка при вчитување на резервациите.";

    return;
  }


  bookingsBody.innerHTML =
    "";


  if (
    !data ||
    data.length === 0
  ) {

    statusElement.textContent =
      "Нема закажани термини.";

    bookingsBody.innerHTML = `
      <tr>
        <td
          colspan="6"
          class="empty"
        >
          Моментално нема резервации.
        </td>
      </tr>
    `;

    return;
  }


  statusElement.textContent =
    `Вкупно резервации: ${data.length}`;


  data.forEach(
    booking => {

      const row =
        document.createElement(
          "tr"
        );


      const time =
        String(
          booking.booking_time
        ).slice(0, 5);


      row.innerHTML = `

        <td>
          ${booking.booking_date}
        </td>

        <td>
          ${time}
        </td>

        <td>
          ${escapeHtml(
            booking.name
          )}
        </td>

        <td>
          ${escapeHtml(
            booking.phone
          )}
        </td>

        <td>
          ${escapeHtml(
            booking.service
          )}
        </td>

        <td>

          <button
            class="delete-button"
            data-id="${booking.id}"
          >
            Откажи
          </button>

        </td>

      `;


      bookingsBody.appendChild(
        row
      );

    }
  );


  document
    .querySelectorAll(
      ".delete-button"
    )
    .forEach(
      button => {

        button.addEventListener(
          "click",
          async function() {

            const id =
              this.dataset.id;


            const confirmed =
              confirm(
                "Дали сигурно сакаш да ја откажеш оваа резервација?"
              );


            if (!confirmed) {
              return;
            }


            const {
              error
            } =
              await supabaseClient
                .from("bookings")
                .delete()
                .eq(
                  "id",
                  id
                );


            if (error) {

              alert(
                error.message
              );

              return;
            }


            await loadBookings();

          }
        );

      }
    );

}


/* ==========================
   SAFETY
========================== */

function escapeHtml(value) {

  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


/* ==========================
   LOGOUT
========================== */

logoutButton.addEventListener(
  "click",
  async function() {

    await supabaseClient.auth
      .signOut();

    window.location.href =
      "login.html";

  }
);


/* ==========================
   START
========================== */

loadBlockedDates();
loadBlockedTimes();
loadBookings();

</script>

</body>
</html>
